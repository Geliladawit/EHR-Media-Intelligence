<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EHR Media Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-semibold text-slate-900">EHR Media Intelligence</h1>
        <p class="text-sm text-slate-500">Semantic search across clinical records</p>
      </div>
      <div id="status" class="flex items-center gap-2 text-sm text-slate-500" aria-live="polite">
        <span id="status-dot" class="inline-block w-2.5 h-2.5 rounded-full bg-amber-400"></span>
        <span id="status-text">connecting…</span>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">

    <!-- Search + filters -->
    <section aria-label="Search" class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6">
      <form id="search-form" role="search" class="flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <label for="query" class="sr-only">Search clinical records</label>
          <input
            id="query"
            type="search"
            autocomplete="off"
            placeholder="e.g. chest pain troponin, diabetic neuropathy, mammogram…"
            class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500"
            aria-describedby="search-hint"
          />
        </div>
        <button
          type="submit"
          id="search-btn"
          class="rounded-lg bg-teal-600 px-6 py-2.5 text-sm font-medium text-white hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2 disabled:opacity-50"
        >Search</button>
      </form>
      <p id="search-hint" class="text-xs text-slate-400 mt-2">Natural-language search across labs, imaging, notes and discharge summaries.</p>

      <div class="flex flex-wrap items-center gap-3 mt-4 pt-4 border-t border-slate-100">
        <label class="text-sm text-slate-600 flex items-center gap-2">
          Type
          <select id="filter-type" class="rounded-md border border-slate-300 px-2 py-1.5 text-sm">
            <option value="">All types</option>
            <option value="lab">Lab</option>
            <option value="imaging">Imaging</option>
            <option value="discharge_summary">Discharge summary</option>
            <option value="clinical_note">Clinical note</option>
          </select>
        </label>
        <label class="text-sm text-slate-600 flex items-center gap-2">
          From
          <input id="filter-from" type="date" class="rounded-md border border-slate-300 px-2 py-1.5 text-sm" />
        </label>
        <label class="text-sm text-slate-600 flex items-center gap-2">
          To
          <input id="filter-to" type="date" class="rounded-md border border-slate-300 px-2 py-1.5 text-sm" />
        </label>
        <button id="clear-filters" type="button" class="text-sm text-teal-700 hover:underline ml-auto">Clear filters</button>
      </div>
    </section>

    <!-- Results -->
    <section aria-label="Search results">
      <div id="results-meta" class="text-sm text-slate-500 mb-3" aria-live="polite"></div>
      <div id="results" class="space-y-3" role="list" aria-label="Matching records"></div>
      <div id="empty-state" class="hidden bg-white rounded-xl border border-slate-200 p-10 text-center text-slate-500">
        <p id="empty-title" class="font-medium text-slate-700"></p>
        <p id="empty-body" class="text-sm mt-1"></p>
      </div>
      <div id="loading" class="hidden space-y-3" aria-hidden="true">
        <div class="bg-white rounded-xl border border-slate-200 p-4 animate-pulse">
          <div class="h-4 bg-slate-200 rounded w-1/3 mb-3"></div>
          <div class="h-3 bg-slate-100 rounded w-2/3"></div>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-4 animate-pulse">
          <div class="h-4 bg-slate-200 rounded w-1/4 mb-3"></div>
          <div class="h-3 bg-slate-100 rounded w-1/2"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Patient detail drawer -->
  <div id="drawer-backdrop" class="hidden fixed inset-0 bg-slate-900/40 z-40" aria-hidden="true"></div>
  <aside
    id="drawer"
    role="dialog"
    aria-modal="true"
    aria-labelledby="drawer-title"
    class="hidden fixed top-0 right-0 h-full w-full sm:w-[480px] bg-white shadow-2xl z-50 overflow-y-auto transform transition-transform duration-200 translate-x-full"
  >
    <div class="sticky top-0 bg-white border-b border-slate-200 px-5 py-4 flex items-start justify-between z-10">
      <div>
        <h2 id="drawer-title" class="text-lg font-semibold text-slate-900">Patient</h2>
        <p id="drawer-subtitle" class="text-sm text-slate-500"></p>
      </div>
      <button id="drawer-close" aria-label="Close patient details"
        class="rounded-md p-1.5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-teal-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div id="drawer-body" class="px-5 py-4 space-y-6"></div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
