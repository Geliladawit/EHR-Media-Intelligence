[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ehr-media-intelligence"
version = "0.1.0"
description = "AI-powered EHR media intelligence: ingestion, FHIR R4 normalization, LLM summaries, semantic search"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
fhir = ["fhir.resources==6.5.0"]
llm = ["anthropic>=0.40,<1", "openai>=1.50,<2"]
search = ["sentence-transformers>=3.0,<4", "faiss-cpu>=1.8,<2", "numpy>=1.26,<3"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
dev = ["pytest>=8.0,<9", "faker>=25.0,<40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
